<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vermietertagebuch</title>
  <meta name="description" content="Die App für eure Hausgemeinschaft: Aufgaben, Müllabfuhr, Social Hub, Umfragen und Ereignisse.">
  <meta name="theme-color" content="#eef1f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d14" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vermietertagebuch">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Handys (iPhone, Android-Handys) erkennen: Navigationsleiste bleibt unten.
    // Android-Tablets schicken kein „Mobile“ mit und bekommen die Leiste rechts.
    if (/iPhone|iPod|Android.+Mobile|Mobile.+Android/i.test(navigator.userAgent)) document.documentElement.classList.add('phone-ua');
  </script>
  <link rel="icon" href="icons/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="css/style.css?v=146">
</head>
<body>
  <!-- Startanimation: Kalender-Tagebuch (steht direkt im HTML, damit sie sofort erscheint) -->
  <div class="splash" id="splash" aria-hidden="true">
    <span class="sp-blob sp-b1"></span><span class="sp-blob sp-b2"></span><span class="sp-blob sp-b3"></span>
    <div class="sp-card">
      <div class="sp-rings"><i></i><i></i></div>
      <div class="sp-head"><span id="sp-month">November</span><span id="sp-wd">Freitag</span></div>
      <div class="sp-day">
        <div class="sp-num sp-today" id="sp-today">13</div>
        <div class="sp-num sp-old" id="sp-old">12</div>
      </div>
      <div class="sp-lines"><i></i><i></i><i></i></div>
      <span class="sp-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
    </div>
  </div>
  <script>
    // Sofort (vor dem ersten Bild): echtes Datum, Hell/Dunkel und Farbschema der App übernehmen
    (function () {
      try {
        var d = new Date(), y = new Date(d.getTime() - 864e5);
        document.documentElement.classList.add('splashing');
        document.getElementById('sp-month').textContent = d.toLocaleDateString('de-DE', { month: 'long' });
        document.getElementById('sp-wd').textContent = d.toLocaleDateString('de-DE', { weekday: 'long' });
        document.getElementById('sp-today').textContent = d.getDate();
        document.getElementById('sp-old').textContent = y.getDate();
        var t = JSON.parse(localStorage.getItem('vt.theme') || '"auto"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var c = JSON.parse(localStorage.getItem('vt.splash') || 'null');
        if (c) {
          var s = document.documentElement.style;
          s.setProperty('--sp-accent', c.accent); s.setProperty('--sp-on', c.fg);
          (c.blobs || []).forEach(function (b, i) { s.setProperty('--sp-b' + (i + 1), b); });
        }
      } catch (e) { /* Standardfarben */ }
    })();
  </script>
  <script>
    // Schneefall (bis 26.12.): einmal vorgezeichnete Schneeebenen, die nur verschoben werden.
    // Das übernimmt der Grafikchip – flüssig auch auf dem iPhone, schon während der Startanimation.
    window.vtSnow = function () {
      var el = document.getElementById('snow'); if (el) return el;
      var W = 420, T = 520, dpr = Math.min(2, window.devicePixelRatio || 1);
      // Ebenen: fern (klein, blass, langsam) · mitte · nah (größer, schneller)
      var L = [[20, .9, 1.6, .22, .4, 24, 10], [14, 1.4, 2.3, .3, .5, 36, 16], [9, 2, 3, .38, .6, 52, 24]];
      function tile(seed, n, r0, r1, a0, a1, col) {
        var c = document.createElement('canvas'); c.width = W * dpr; c.height = T * dpr;
        var x = c.getContext('2d'); x.scale(dpr, dpr); x.fillStyle = col;
        var s = seed; function rnd() { s = (s * 16807) % 2147483647; return s / 2147483647; }
        for (var i = 0; i < n; i++) {
          var px = rnd() * W, py = rnd() * T, r = r0 + rnd() * (r1 - r0); x.globalAlpha = a0 + rnd() * (a1 - a0);
          // am Rand doppelt zeichnen, damit die Kachel nahtlos wiederholt
          for (var dx = -W; dx <= W; dx += W) for (var dy = -T; dy <= T; dy += T) {
            if (Math.abs(dx) && (px + dx < -4 || px + dx > W + 4)) continue;
            if (Math.abs(dy) && (py + dy < -4 || py + dy > T + 4)) continue;
            x.beginPath(); x.arc(px + dx, py + dy, r, 0, 6.2832); x.fill();
          }
        }
        return 'url(' + c.toDataURL('image/png') + ')';
      }
      el = document.createElement('div'); el.id = 'snow'; el.setAttribute('aria-hidden', 'true');
      L.forEach(function (l, i) {
        var sway = document.createElement('div'); sway.className = 'sn-sway';
        sway.style.animationDuration = (5 + i * 1.7) + 's'; sway.style.setProperty('--sw', l[6] + 'px');
        var f = document.createElement('div'); f.className = 'sn';
        f.style.setProperty('--d', tile(7 + i * 31, l[0], l[1], l[2], l[3], l[4], '#ffffff'));
        f.style.setProperty('--l', tile(7 + i * 31, l[0], l[1], l[2], l[3] + .1, l[4] + .15, '#9fb3d6'));
        f.style.setProperty('--t', T + 'px'); f.style.backgroundSize = W + 'px ' + T + 'px';
        f.style.animationDuration = (T / l[5]) + 's';
        sway.appendChild(f); el.appendChild(sway);
      });
      document.body.appendChild(el); return el;
    };
    try {
      var n = new Date(), k = n.getFullYear() * 1e4 + (n.getMonth() + 1) * 100 + n.getDate();
      if (k < 20261227 && !matchMedia('(prefers-reduced-motion: reduce)').matches) window.vtSnow();
    } catch (e) { /* kein Schnee */ }
  </script>
  <!-- Farbiger, sanft bewegter Hintergrund – damit das Glas etwas zum Brechen hat -->
  <div class="backdrop" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>

  <!-- SVG-Filter für die Lichtbrechung der Liquid-Glass-Linse (nur Chromium unterstützt das als backdrop-filter) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="38" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main id="app">
    <div id="view" class="view"></div>
  </main>

  <div class="dock" id="dock" hidden>
    <nav class="tabbar glass" id="tabbar" aria-label="Navigation">
      <div class="lens" id="lens" aria-hidden="true"><div class="lens-glass"></div></div>
    </nav>
  </div>

  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js?v=146"></script>
</body>
</html>
