name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # nacheinander veröffentlichen statt abzubrechen

jobs:
  # 1) Dateien packen und hochladen
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # 2) Veröffentlichen – als eigener Schritt danach. Im selben Schritt direkt nach dem Hochladen
  #    hat GitHub die Datei oft noch nicht registriert („No artifacts named github-pages“).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kurz warten, bis GitHub das Paket registriert hat
        run: sleep 15
      - id: deployment
        uses: actions/deploy-pages@v4
